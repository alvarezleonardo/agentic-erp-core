name: Propuesta de mejora
description: Sugerí una funcionalidad o un cambio
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Contá el caso de uso, no solo la solución.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo imaginás que funcionaría.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
  - type: dropdown
    id: paquete
    attributes:
      label: Paquete involucrado
      options:
        - "@agentic-erp/core"
        - "@agentic-erp/llm"
        - "@agentic-erp/mcp-client"
        - "@agentic-erp/mcp-contract"
        - examples/erp-sintetico
        - contracts/genui
        - No sé
  - type: checkboxes
    id: principios
    attributes:
      label: Principios
      options:
        - label: Leí los principios de ADR-001 y la propuesta no los rompe (el modelo no confirma, el servidor pone los montos, tokens y PIN fuera del modelo).
          required: true
